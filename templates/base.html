<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Preston Corless">
    <meta name="description" content="{% block description %}pgattic's personal website and blog{% endblock description %}">
    <title>{% block title %}Untitled{% endblock title %} | {{ config.extra.site_name }}</title>
    <link rel="icon" type="image/svg" href="/icon.svg">
    <style>
:root {
  color-scheme: light dark;
  font-family: "Roboto", sans-serif;
  --h-color: light-dark(#171717, #ffffff);
  --text-color: light-dark(#404040, #d4d4d4);
  color: var(--text-color);
}

h1, h2, h3, h4, h5, h6 { color: var(--h-color); }

body {
  background: light-dark(#f4f4f5, #18181b);
  margin: 0;

  #header-container {
    background: light-dark(#e4e4e7, #27272a);
    display: block;
    header {
      margin: 0 auto;
      padding: 16px;
      max-width: 900px;
      height: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      div {
        display: flex;
        align-items: center;
        gap: 12px;
        a {
          text-decoration: none;
          color: var(--text-color);
        }
        #home-a {
          text-decoration: none;
          color: light-dark(#000, #fff);
          font-size: 24px;
          font-weight: bold;
        }
      }
    }
  }
  section {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;

    h1 {
      margin: 0 0 16px;
      font-size: 2em;
    }
    h2 {
      margin: 0 0 12px;
    }
    img {
      max-width: 100%;
      display: block;
      margin: 0 auto;
    }
    pre {
      padding: 8px;
      text-wrap: wrap;
    }
    code:not(pre > code) {
      background: light-dark(#e4e4e7, #27272a);
      padding: 2px;
      border-radius: 4px;
    }
    .img-desc {
      font-style: italic;
      text-align: center;
    }
    #footer-container {
      display: block;
      width: 100%;
      footer {
        margin-top: 32px;
        display: flex;
        justify-content: space-between;
        #contact-info {
          display: flex;
          gap: 16px;
          a {
            color: var(--text-color);
            text-decoration: none;
            svg {
              width: 16px;
              height: 16px;
            }
          }
        }
      }
    }
  }
}

/* Make headings a positioning context */
h1[id], h2[id], h3[id], h4[id], h5[id], h6[id] { position: relative; }

/* Anchor: hang outside the left edge and stay hidden until hover/focus */
.zola-anchor {
  position: absolute;
  left: 0;
  transform: translateX(-100%);
  text-decoration: none;
  opacity: 0;
  transition: opacity .15s ease;
  padding-right: .25rem;
  font-weight: 600;
  color: light-dark(#888, #444);
}

/* Show on hover of the heading or when the anchor is keyboard-focused */
h1[id]:hover .zola-anchor,
h2[id]:hover .zola-anchor,
h3[id]:hover .zola-anchor,
h4[id]:hover .zola-anchor,
h5[id]:hover .zola-anchor,
h6[id]:hover .zola-anchor,
.zola-anchor:focus-visible {
  opacity: 1;
}

    </style>
  </head>
  <body>
    <div id="header-container">
      <header>
        <div id="header-left">
          <a id="home-a" href="https://pgattic.dev">pgattic.dev</a>
        </div>
        <div id="header-right">
          <a href="/blog">Blog</a>
          <a href="https://github.com/pgattic" target="_blank">Projects</a>
          <a href="/resume">Resume</a>
        </div>
      </header>
    </div>
    <section>
      <div>
        {% block content %}{% endblock content %}
      </div>
      <div id="footer-container">
        <footer>
          <div>&copy; 2018&ndash;<span id="year">Now</span> Preston Corless.</div>
          <div id="contact-info">
            <a href="https://github.com/pgattic">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

              </svg>
            </a>
            <a href="https://linkedin.com/in/pgattic">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>

            </a>
            <a href="https://x.com/pgattic1">
              <svg viewBox="28 28 72 72" xmlns="http://www.w3.org/2000/svg">
                <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M86.8918 28.25H99.0219L72.5243 58.5334L103.698 99.75H79.285L60.1647 74.7536L38.2929 99.75H26.1627L54.5069 67.3565L24.5938 28.25H49.6199L66.9004 51.0974L86.8918 28.25ZM82.6337 92.4904H89.3555L45.9716 35.1301H38.7584L82.6337 92.4904Z"/>
              </svg>
            </a>
          </div>
        </footer>
      </div>
      <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
    </section>
  </body>
</html>
